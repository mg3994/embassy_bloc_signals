[package]
name = "bloc_signals"
version = "0.1.0"
edition = "2021"
authors = ["Jules"]
description = "A synchronous & async reactive state management library for embedded Rust & Embassy, bridging BLoC semantics with signals."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["embassy", "bloc", "signals", "no_std", "state-management"]
categories = ["embedded", "no-std", "asynchronous"]

[features]
default = ["std", "embassy"]
std = ["alloc"]
alloc = []
embassy = ["dep:embassy-sync", "dep:embassy-futures"]
defmt = ["dep:defmt"]
log = ["dep:log"]

[dependencies]
embassy-sync = { version = "0.6", optional = true }
embassy-futures = { version = "0.1", optional = true }
critical-section = { version = "1.1" }
heapless = "0.8"
defmt = { version = "0.3", optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
embassy-executor = { version = "0.6", features = ["arch-std", "executor-thread"] }
static_cell = "2.1"
tokio = { version = "1.38", features = ["full"] }
